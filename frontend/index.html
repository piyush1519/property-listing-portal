<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Listing Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Property Listing Portal</h1>
    <p>Find and manage properties easily</p>
</header>

<main>

    <!-- Add Property Section -->
    <section class="form-section">

        <h2>Add Property</h2>

        <form id="property-form">

            <input
                type="text"
                id="title"
                placeholder="Property title"
                required
            >

            <textarea
                id="description"
                placeholder="Description"
                required
            ></textarea>

            <input
                type="text"
                id="location"
                placeholder="Location"
                required
            >

            <input
                type="text"
                id="type"
                placeholder="Property type"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="1"
                required
            >

            <input
                type="number"
                id="bedrooms"
                placeholder="Bedrooms"
                min="0"
                required
            >

            <input
                type="number"
                id="area"
                placeholder="Area"
                min="1"
                required
            >

            <input
                type="text"
                id="ownerAgent"
                placeholder="Owner / Agent"
            >

            <input
                type="text"
                id="status"
                value="AVAILABLE"
                placeholder="Status"
                required
            >

            <button type="submit">
                Add Property
            </button>

        </form>

        <p id="form-message"></p>

    </section>


    <!-- Search and Filter Section -->
    <section class="search-section">

        <h2>Search & Filter Properties</h2>

        <div class="filter-container">

            <input
                type="text"
                id="search-location"
                placeholder="Search by location"
            >

            <select id="search-type">
                <option value="">All Property Types</option>
                <option value="Apartment">Apartment</option>
                <option value="House">House</option>
                <option value="Villa">Villa</option>
                <option value="Plot">Plot</option>
            </select>

            <select id="search-status">
                <option value="">All Statuses</option>
                <option value="AVAILABLE">Available</option>
                <option value="SOLD">Sold</option>
                <option value="RENTED">Rented</option>
            </select>

            <select id="search-bedrooms">
                <option value="">Any Bedrooms</option>
                <option value="1">1 Bedroom</option>
                <option value="2">2 Bedrooms</option>
                <option value="3">3 Bedrooms</option>
                <option value="4">4 Bedrooms</option>
                <option value="5">5 Bedrooms</option>
            </select>

            <div class="filter-buttons">

                <button
                    type="button"
                    id="search-button"
                >
                    Search
                </button>

                <button
                    type="button"
                    id="clear-button"
                >
                    Clear Filters
                </button>

            </div>

        </div>

    </section>


    <!-- Property List Section -->
    <section class="property-section">

        <h2>Available Properties</h2>

        <div id="property-list">
            <p>Loading properties...</p>
        </div>

    </section>


    <!-- Property Details Section -->
    <section
        id="property-details-container"
        class="property-details-section"
        style="display: none;"
    >

        <h2>Property Details</h2>

        <div id="property-details">
        </div>

        <button
            type="button"
            id="close-details-button"
        >
            Close Details
        </button>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
