<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Listing Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Property Listing Portal</h1>
    <p>Find and manage properties easily</p>
</header>

<main>

    <section class="form-section">

        <h2>Add Property</h2>

        <form id="property-form">

            <input
                type="text"
                id="title"
                placeholder="Property title"
                required
            >

            <textarea
                id="description"
                placeholder="Description"
                required
            ></textarea>

            <input
                type="text"
                id="location"
                placeholder="Location"
                required
            >

            <input
                type="text"
                id="type"
                placeholder="Property type"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Price"
                min="1"
                required
            >

            <input
                type="number"
                id="bedrooms"
                placeholder="Bedrooms"
                min="0"
                required
            >

            <input
                type="number"
                id="area"
                placeholder="Area"
                min="1"
                required
            >

            <input
                type="text"
                id="ownerAgent"
                placeholder="Owner / Agent"
            >

            <input
                type="text"
                id="status"
                value="AVAILABLE"
                placeholder="Status"
                required
            >

            <button type="submit">
                Add Property
            </button>

        </form>

        <p id="form-message"></p>

    </section>


    <section class="property-section">

        <h2>Available Properties</h2>

        <div id="property-list">
            <p>Loading properties...</p>
        </div>

    </section>

</main>

<script src="app.js"></script>

</body>
</html>
